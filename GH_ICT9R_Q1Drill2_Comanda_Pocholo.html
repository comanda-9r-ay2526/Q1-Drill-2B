<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q1 Drill 2</title>
	<style>
		body {
			background-image: url(https://fabrikbrands.com/wp-content/uploads/Spotify-Logo-4.png);
			background-size: cover;
			backdrop-filter: blur(3px);
		}

		h1 {
			text-align: center;

		}

		form {
			background-color: rgba(230, 230, 230, 0.9);
			width: 30%;
			padding: 25px;
			border-radius: 26px 26px 26px 26px;	
			box-shadow: -1px 0px 29px 3px rgba(68,68,68,0.75);
			margin: 0 auto;
			font-family: "Plus Jakarta Sans", sans-serif;

		}


		.plus-jakarta-sans-<uniquifier> {
  			font-family: "Plus Jakarta Sans", sans-serif;
  			font-optical-sizing: auto;
  			font-weight: <weight>;
  			font-style: normal;
		}

		input[type=text]{
  			width: 100%;
 			padding: 12px;
 			margin: 8px 0;
 			display: inline-block;
  			border: 1px solid #ccc;
 			border-radius: 4px;
  			box-sizing: border-box;
		}

		input[type=email], select {
  			width: 100%;
 			padding: 12px;
 			margin: 8px 0;
 			display: inline-block;
  			border: 1px solid #ccc;
 			border-radius: 4px;
  			box-sizing: border-box;
		}

		textarea {
  			width: 100%;
 			padding: 12px;
 			margin: 8px 0;
 			display: inline-block;
  			border: 1px solid #ccc;
 			border-radius: 4px;
  			box-sizing: border-box;
		}

		input[type=submit] {
 			width: 49%;
  			background-color: #32a852;
  			color: white;
  			padding: 20px;
  			margin: 8px 0;
  			border: solid;
  			border-radius: 4px;
  			border-color: #278240;
  			cursor: pointer;
		}

		input[type=reset] {
 			width: 49%;
  			background-color: #e03450;
  			color: white;
  			padding: 20px;
  			margin: 8px 0;
  			border: solid;
  			border-radius: 4px;
  			border-color: #b0283f;
  			cursor: pointer;
		}

	</style>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
	<br>
	<br>
	<br>
	<br>
	<form>
		<h1>Music Recommendation</h1>

		<label for="name">Name</label><br>
		<input type="text" name="name" placeholder="John Doe"><br><br>

		<label for="email">Email</label><br>
		<input type="email" name="email" placeholder="johndoe@gmail.com"><br><br>

		<label for="music">Song/Music Title</label><br>
		<input type="text" name="music"><br><br>

		<label for="whyreco">Why do you recommend this?</label><br>
		<textarea name="whyreco" placeholder="feedback here..." maxlength="400" rows="7" cols="50"></textarea><br><br>

		<label for="where">Where did you first hear this?</label><br>
		<select name="platform">
			<option>-- Select --</option>
			<option>Social Media (Tiktok, Instagram, etc.)</option>
			<option>From a friend</option>
			<option>From a family member</option>
		</select><br><br>

		<label for="genre">Genre (select all that apply)</label><br>

		<input type="checkbox">
		<label>Rock</label>

		<input type="checkbox">
		<label>Hip-Hop</label>

		<input type="checkbox">
		<label>R&B</label>

		<input type="checkbox">
		<label>K-Pop</label>

		<input type="checkbox">
		<label>Jazz</label>

		<input type="checkbox">
		<label>Classical</label><br><br>

		<label for="rating">Rating for recommended song/music</label><br>
		<input type="radio" name="rating">
		<label for="rating">1</label>

		<input type="radio" name="rating">
		<label for="rating">2</label>

		<input type="radio" name="rating">
		<label for="rating">3</label>

		<input type="radio" name="rating">
		<label for="rating">4</label>

		<input type="radio" name="rating">
		<label for="rating">5</label><br><br>

		<input type="submit" name="" placeholder="Submit your recommendation">
		<input type="reset" name="">
	</form>
</body>
</html>
